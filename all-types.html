<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人間関係タイプ 全8タイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F3EF; --surface:#FFFFFF; --ink:#232427; --muted:#6E7176; --faint:#9A9CA0;
    --line:#E4E3DD; --chrome:#2B333D;
    --coral:#C0492B; --coral-soft:#FBEDE7; --coral-ink:#7A2E1A;
    --teal:#0F6E56; --teal-soft:#E3F1EB; --teal-ink:#0A4A3A;
    --display:"Noto Sans JP",sans-serif; --body:"Noto Sans JP",sans-serif;
    --shadow:0 1px 2px rgba(20,20,20,.05),0 10px 30px rgba(20,20,20,.06);
    --radius:20px; --card-pad-x:30px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{font-family:var(--body); color:var(--ink); background:var(--bg); line-height:1.85; letter-spacing:.01em}
  .wrap{max-width:680px; margin:0 auto; padding:22px 16px 60px}

  .toolbar{position:sticky; top:0; z-index:9; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line); margin-bottom:18px}
  .toolbar button{font-family:var(--body); font-size:13px; font-weight:700; cursor:pointer; color:#fff;
    background:var(--chrome); border:none; border-radius:99px; padding:10px 20px}
  .toolbar .note{font-size:12px; color:var(--muted)}

  h1{font-family:var(--display); font-weight:700; font-size:clamp(22px,4.6vw,30px); letter-spacing:.02em; margin-bottom:8px}
  .sub{font-size:12.5px; color:var(--muted); margin-bottom:16px; max-width:60em}

  .index{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:26px}
  .ix{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface); font-size:12.5px}
  .ix .c{font-family:var(--display); font-weight:700; font-size:10.5px; letter-spacing:.14em; color:#fff; border-radius:6px; padding:2px 7px}
  .ix.open .c{background:var(--coral)} .ix.guard .c{background:var(--teal)}

  /* ▼ 以下は prototype.html の結果カードと同じスタイル */
  .card{ --accent:var(--teal); --accent-soft:var(--teal-soft); --accent-ink:var(--teal-ink);
    background:var(--surface); border-radius:22px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line);
    margin-bottom:24px; break-inside:avoid; page-break-inside:avoid }
  .card.pole-open{ --accent:var(--coral); --accent-soft:var(--coral-soft); --accent-ink:var(--coral-ink) }
  .card.pole-guard{ --accent:var(--teal); --accent-soft:var(--teal-soft); --accent-ink:var(--teal-ink) }
  .card-head{ padding:36px 26px 30px; text-align:center; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--accent-soft) 0%, #fff 100%) }
  .chip{ display:inline-block; font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.26em;
    color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:99px; padding:5px 14px 5px 20px; margin-bottom:16px }
  .tname{ font-family:var(--display); font-weight:900; font-size:clamp(25px,5.8vw,32px); color:var(--accent-ink); letter-spacing:.02em; margin:0 0 12px }
  .tcatch{ font-family:var(--display); font-weight:700; font-size:13.5px; color:var(--accent); letter-spacing:.04em; margin:0 0 6px }
  .card-body{ padding:28px var(--card-pad-x) 32px }
  .sectlabel{ font-size:18px; font-weight:900; color:var(--ink); letter-spacing:.02em;
    margin:42px 0 16px; display:flex; align-items:center; gap:10px; line-height:1.5 }
  .sectlabel::before{ content:""; width:4px; height:19px; border-radius:2px; background:var(--accent); flex:none }
  .card-body > .sectlabel:first-child, .row-block > .sectlabel{ margin-top:0 }
  .axis-track-wrap{ position:relative }
  .axis-ends .on{ color:var(--ink); font-weight:700 }
  ul.aru{ list-style:none; margin:0 0 28px; display:flex; flex-direction:column; gap:11px }
  ul.aru li{ position:relative; padding-left:22px; font-size:14px; line-height:1.9; color:var(--ink) }
  ul.aru li::before{ content:""; position:absolute; left:4px; top:11px; width:6px; height:6px; border-radius:50%; background:var(--accent) }
  .row-block{ margin-bottom:26px }
  .row-block p{ font-size:14px; line-height:1.9; color:var(--ink) }
  /* トリセツ（取扱説明書）：このタイプとの付き合い方 */
  .toriset{ background:var(--accent-soft); border-radius:var(--radius); padding:22px 22px; margin-bottom:26px }
  .toriset .ts-label{ font-family:var(--display); font-weight:700; font-size:14px; color:var(--accent-ink); letter-spacing:.03em; margin-bottom:4px }
  .toriset .ts-lead{ font-size:12.5px; color:var(--muted); margin-bottom:14px }
  .ts-item{ padding:12px 0; border-top:1px solid rgba(0,0,0,.06) }
  .ts-item:first-child{ border-top:none; padding-top:2px }
  .ts-item .ts-l{ display:block; font-weight:700; font-size:12.5px; color:var(--accent-ink); margin-bottom:3px }
  .ts-item .ts-t{ font-size:13px; line-height:1.7; color:var(--ink) }
  /* 深層（本質）：なぜそう振る舞うのか */
  .pv .cap{ font-size:11px; letter-spacing:.12em; font-weight:700; margin-bottom:6px; color:var(--accent-ink) }
  .pv .cap-axis{ font-family:var(--display); font-weight:700; font-size:15px; margin-bottom:14px; color:var(--accent-ink) }
  .focus-item p{ font-size:13px; line-height:1.7; color:var(--ink) }
  .compat{ margin-bottom:26px }
  .compat-hint{ font-size:12.5px; color:var(--muted); margin:-2px 0 14px }
  .compat-list{ display:flex; flex-direction:column }
  .compat-row{ padding:13px 0; border-top:1px solid var(--line) }
  .compat-row:first-child{ border-top:none }
  .ct-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px }
  .ct-name{ font-family:var(--display); font-weight:700; font-size:13.5px; color:var(--ink); letter-spacing:.02em; border-radius:8px; padding:3px 10px }
  .compat-row.pole-open .ct-name{ background:var(--coral-soft); color:var(--coral-ink) }
  .compat-row.pole-guard .ct-name{ background:var(--teal-soft); color:var(--teal-ink) }
  .ct-code{ font-size:10.5px; letter-spacing:.16em; color:var(--faint); font-weight:700 }
  .ct-tag{ font-size:11px; font-weight:700; letter-spacing:.02em; border-radius:7px; padding:3px 9px; background:var(--chrome); color:#fff; white-space:nowrap }
  .ct-best{ font-size:10px; letter-spacing:.06em; font-weight:700; color:#fff; border-radius:99px; padding:2px 9px; white-space:nowrap }
  .compat-row.pole-open .ct-best{ background:var(--coral) }
  .compat-row.pole-guard .ct-best{ background:var(--teal) }
  .compat-row.is-best{ border-radius:10px }
  .compat-row.is-best.pole-open{ box-shadow:inset 3px 0 0 var(--coral); padding-left:12px }
  .compat-row.is-best.pole-guard{ box-shadow:inset 3px 0 0 var(--teal); padding-left:12px }
  .ct-self{ margin-left:auto; font-size:10px; letter-spacing:.06em; color:#fff; background:var(--accent); border-radius:99px; padding:2px 9px; font-weight:700 }
  .ct-text{ font-size:13px; line-height:1.65; color:var(--ink) }


  .formula{ display:flex; flex-direction:column; align-items:center; gap:7px;
    margin:18px 0 4px; padding:18px 14px; background:var(--bg); border-radius:14px }
  .f-row{ display:flex; flex-wrap:nowrap; justify-content:center; align-items:center; gap:6px }
  @media (max-width:400px){ .f-chip{font-size:12px; padding:5px 9px} .f-op{font-size:12px} .f-row{gap:4px} }
  @media (max-width:340px){ .f-row{flex-direction:column; gap:3px} }
  .f-chip{ font-size:13px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft);
    border-radius:99px; padding:6px 13px; white-space:nowrap; flex:none }
  .f-op{ color:var(--faint); font-size:13px; font-weight:700 }
  .f-arrow{ color:var(--accent); font-size:14px; line-height:1 }
  .f-type{ font-size:17px; font-weight:900; color:var(--accent-ink) }
  .f-type small{ font-size:12px; font-weight:700; color:var(--muted); margin-left:7px; letter-spacing:.1em }
  .link-note{ font-size:13.5px; line-height:1.9; color:var(--muted); background:var(--bg);
    border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:12px 14px; margin:14px 0 4px }
  .link-note b{ color:var(--accent-ink) }
  /* 3つの軸：回答に依存しないので、目盛りでなく「どちら側か」だけを示す */
  .poles{ display:grid; gap:10px; margin-bottom:4px }
  .pole-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .pole-name{ flex:none; width:44px; font-size:13px; color:var(--muted) }
  .pole-pick{ font-size:15px; font-weight:900; color:var(--accent-ink); background:var(--accent-soft);
    border-radius:99px; padding:5px 14px }
  .pole-alt{ font-size:14px; color:var(--faint) }
  .pole-alt::before{ content:"／ "; color:var(--line) }
  /* ===== 診断（prototype.html）と揃えた表現：エンブレム・放射・トリセツのバンド ===== */
  .emblem{ width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, var(--accent-soft), #fff 78%); border:1px solid var(--line); color:var(--accent) }
  .emblem svg{ width:44px; height:44px }
  .emblem-wrap{ position:relative; width:100%; max-width:330px; height:150px; margin:0 auto 6px }
  .emblem-wrap .emblem{ position:absolute; left:50%; top:23px; transform:translateX(-50%); margin:0 }
  .ray{ position:absolute; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--accent-ink); white-space:nowrap }
  .ray i{ display:block; height:1px; background:var(--accent); opacity:.45; width:26px }
  .ray b{ display:block; width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.65; flex:none }
  .ray-l{ left:0; top:52px; flex-direction:row }
  .ray-r1{ right:0; top:26px; flex-direction:row-reverse }
  .ray-r2{ right:0; top:86px; flex-direction:row-reverse }
  .toriset-band{ margin:34px calc(-1 * var(--card-pad-x)) 30px; padding:30px 22px 32px; background:var(--accent); color:#fff; text-align:center }
  .toriset-band .ts-label{ font-size:12.5px; font-weight:700; color:#fff; opacity:.85; letter-spacing:.14em; margin-bottom:6px }
  .toriset-band .ts-title{ font-size:22px; font-weight:900; color:#fff; letter-spacing:.04em; margin:0 0 8px }
  .toriset-band .ts-lead{ font-size:13px; color:#fff; opacity:.82; margin-bottom:20px; line-height:1.85; text-wrap:balance }
  .ts-card{ background:#fff; border-radius:14px; overflow:hidden; margin-bottom:12px; text-align:left }
  .ts-card .ts-l{ display:block; font-size:13.5px; font-weight:700; color:var(--accent-ink); padding:11px 16px; border-bottom:1px solid var(--line); margin:0 }
  .ts-card .ts-l .num{ font-weight:900; margin-right:6px }
  .ts-card .ts-t{ display:block; font-size:14px; line-height:1.95; color:var(--ink); padding:14px 16px }
  @media (max-width:360px){ .ray{ font-size:11.5px } .ray i{ width:16px } }
  /* 深層：ページで唯一の暗い面にして「奥に沈む」感じを出す。
     トリセツ（アクセントの色面）とは別の軸で強調するので、見せ場は競合しない。
     右上に同心の弧を薄く重ね、層の奥行きを示す。 */
  .honshitsu{
    position:relative; overflow:hidden; border:none; border-radius:var(--radius);
    padding:30px 22px 26px; margin-bottom:26px;
    background:radial-gradient(120% 90% at 50% -10%, #3B4652 0%, #2B333D 55%, #222A33 100%);
    color:#fff;
  }
  .honshitsu::before{
    content:""; position:absolute; top:-96px; right:-72px; width:220px; height:220px;
    border-radius:50%; border:1px solid rgba(255,255,255,.10);
    box-shadow:0 0 0 22px rgba(255,255,255,.05), 0 0 0 46px rgba(255,255,255,.035);
    pointer-events:none;
  }
  .honshitsu > *{position:relative}
  .honshitsu .hs-sub{font-size:13px; color:rgba(255,255,255,.62); margin-bottom:16px}
  .honshitsu .hs-core{font-size:15px; line-height:1.95; color:#fff; margin-bottom:16px}
  .honshitsu .hs-cost{font-size:14px; line-height:1.9; color:rgba(255,255,255,.74); margin-bottom:18px}
  .honshitsu .hs-loop{
    font-size:14px; line-height:1.9; color:#fff;
    background:rgba(255,255,255,.09); border-left:3px solid rgba(255,255,255,.34);
    border-radius:0 12px 12px 0; padding:15px 16px;
  }
  /* 印刷ボタンはPCでのみ出す（スマホでは使わないため） */
  @media (max-width:640px){ .pc-only{ display:none } }
  /* 8タイプを紙に出すと暗い面が8つ並んで重くなるため、印刷時だけ白地に戻す */
  @media print{
    .honshitsu{ background:#fff !important; color:var(--ink) !important; border:1px solid var(--line) !important }
    .honshitsu::before{ display:none }
    .honshitsu .hs-sub{ color:var(--faint) !important }
    .honshitsu .hs-core{ color:var(--ink) !important }
    .honshitsu .hs-cost{ color:var(--muted) !important }

    body{ background:#fff }
    .wrap{ max-width:none; padding:0 }
  .no-print{ display:none !important }
    .index{ margin-bottom:12px }
    .card{ box-shadow:none; margin-bottom:12px }
    @page{ size:A4; margin:12mm }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="toolbar no-print pc-only">
    <button onclick="window.print()">印刷 / PDFで保存</button>
  </div>

  <h1>人間関係タイプ 全8タイプ</h1>

  <div class="index no-print">
    <a class="ix open"  href="#OBL"><span class="c">OBL</span><span>突撃隊長</span></a>
    <a class="ix open"  href="#OBS"><span class="c">OBS</span><span>正論ハンマー</span></a>
    <a class="ix open"  href="#OKL"><span class="c">OKL</span><span>お祭り隊長</span></a>
    <a class="ix open"  href="#OKS"><span class="c">OKS</span><span>自由人コメンテーター</span></a>
    <a class="ix guard" href="#GBL"><span class="c">GBL</span><span>沈黙の大黒柱</span></a>
    <a class="ix guard" href="#GBS"><span class="c">GBS</span><span>縁の下の職人</span></a>
    <a class="ix guard" href="#GKL"><span class="c">GKL</span><span>根回しの仕掛け人</span></a>
    <a class="ix guard" href="#GKS"><span class="c">GKS</span><span>がんばり屋の調整役</span></a>
  </div>

  <div id="gallery"></div>
</div>

<script>
// ▼ データとロジックは prototype.html から転記（結果カードの表示項目・レイアウトを一致させるため）
const TYPES = {
 OBL:{name:'突撃隊長',pole:'open',catch:'気づけばいつも、先頭。',
  aru:['沈黙が3秒続くと、つい自分が口火を切る','「とりあえずやってみよう」が口癖','論破してから「言いすぎた」と気づく'],
  tsuyomi:'停滞をこじ開ける突破力。最初の一歩を踏める。熱量で巻き込む。対立や責任から逃げない。',
  aishou:'縁の下の職人(GBS)・沈黙の大黒柱(GBL)が背後を固めると最強。でも、がんばり屋の調整役(GKS)は、あなたの圧で本音を言えなくなっているかも。',
  hitotsu:'あなたの持ち味は、停滞した空気をこじ開ける突破力です。みんなが二の足を踏む場面でも、最初の一歩を踏み出して周りを巻き込んでいけますが、その一方で、勢いのまま話を進めてしまい、気づけば誰も本音を言っていない、なんてことになりがちです。強すぎる直球は、ときに相手を萎縮させ能動的な発言を妨げてしまうので、「進める前に、ひと呼吸おくこと」を意識してみましょう。自分で踏み込んで突破したいと思った瞬間に、あえて「みんなはどう思う？」と先に問いを投げかけてみてください。あなたが半歩引くと、周りの一歩が出てきます。その時、あなた一人でやるよりずっと大きな力が手に入ります。'},
 OBS:{name:'正論ハンマー',pole:'open',catch:'おかしいことは、おかしい。',
  aru:['「それ論理通ってないですよね」と言ってしまう','ルールや規則を守っていないと、モヤモヤが顔に出る','後で「言い方きつかったかな」と一人反省'],
  tsuyomi:'場の品質管理者。曖昧さや欺瞞を許さず議論を正す。',
  aishou:'縁の下の職人(GBS)と固い信頼。でも、根回しの仕掛け人(GKL)の曖昧さには、あなたが先にイラついてしまう。',
  hitotsu:'あなたの持ち味は、曖昧さや欺瞞を見逃さない、筋を通す力です。議論のほころびにいち早く気づき、場を整えていけますが、その一方で、正論を言い切った瞬間に相手が黙り込み、場の温度が下がってしまう、なんてことになりがちです。鋭い正しさは、ときに相手の逃げ場を奪い、「批判ばかりの人」と受け取られてしまうので、「正しさと伝え方は別物だ」と意識してみましょう。指摘したくなった瞬間に、あえて「ここは良いと思う」と一つ認めてから本題に入ってみてください。同じ中身でも、相手の受け取り方は驚くほど変わります。その積み重ねが、あなたの正しさを信頼へと変えていきます。'},
 OKL:{name:'お祭り隊長',pole:'open',catch:'とにかく、盛り上げる。',
  aru:['場が重くなると、冗談で空気を変えにいく','対立しそうになると、つい話題をそらす','実は、嫌われるのがけっこう怖い'],
  tsuyomi:'場のエネルギー源。誰とでも打ち解け、場の空気を作る。',
  aishou:'自由人コメンテーター(OKS)と最高に楽しい。でも、正論ハンマー(OBS)に詰められると、急に弱い。',
  hitotsu:'あなたの持ち味は、その場をぱっと明るくするエネルギーです。誰とでも打ち解け、場の空気そのものを作っていけますが、その一方で、重い話になりそうな瞬間につい冗談で流してしまい、家に帰ってから「本当は言うべきだった」と思い出す、なんてことになりがちです。場をしのぐ明るさは、ときに解くべき問題にフタをしてしまうので、「茶化す前に、本音を一つだけ置く」と意識してみましょう。空気をゆるめたくなった瞬間に、あえて「私はこう思う」と短く本心を添えてみてください。あなたの明るさは消えるどころか、みんなが安心して本音を出せる空気へと育っていきます。'},
 OKS:{name:'自由人コメンテーター',pole:'open',catch:'言うだけ、言っておく。',
  aru:['感想やアイデアは言うが「で、誰がやる？」で静かになる','面倒な役回りは、自然に避けている','「自分は自分」と線引きして、周りと群れない'],
  tsuyomi:'自由な発想と歯に衣着せぬ視点。空気に流されない独立性。',
  aishou:'お祭り隊長(OKL)と相思相愛。沈黙の大黒柱(GBL)に「で、君は？」と問われると固まる。縁の下の職人(GBS)とは、そりが合わない。',
  hitotsu:'あなたの持ち味は、空気に流されない自由な視点です。歯に衣着せず、ほかの人が見落とす角度から本質を突いていけますが、その一方で、「で、誰がやる？」という空気になった瞬間、自分だけそっと一歩引いてしまう、なんてことになりがちです。良い意見を言うほど当事者になり損ね、せっかくの鋭さが信頼につながらないので、「言ったことは、半歩だけ引き受ける」と意識してみましょう。意見を述べた直後に、あえて「この部分なら自分がやります」と小さく手を挙げてみてください。引き受けても自由は失われません。むしろ、あなたの言葉に確かな影響力が宿っていきます。'},
 GBL:{name:'沈黙の大黒柱',pole:'guard',catch:'多くは語らない。でも逃げない。',

// エンブレムから放射する3軸のキーワード（出ている側の軸名）。タイプコードから引く。
function raysHTML(code){
  var pos=['ray-r1','ray-l','ray-r2'];
  // all-types.html の AX には poles が無いので、コードの各桁（O/G, B/K, L/S）で直接判定する。
  var LEFT=['O','B','L'];
  return ['h','c','w'].map(function(axis,i){
    var meta=AX[axis];
    var word = code[i]===LEFT[i] ? meta.left : meta.right;
    return '<span class="ray '+pos[i]+'"><b></b><i></i>'+word+'</span>';
  }).join('');
}
function buildCard(code){
  const t=TYPES[code];
  const pole=(t.pole==='guard')?'pole-guard':'pole-open';
  // 3軸（本音・衝突・重心）：タイプが示す極にドットを置く
  // 3軸はタイプコードだけで決まる（回答に依存しない）。全8タイプの一覧では
  // 目盛り上の位置を持たないので、スライダーではなく「どちら側か」だけを示す。
  const ax3=[
    ['本音', AX.h.left, AX.h.right, code[0]==='O'],
    ['衝突', AX.c.left, AX.c.right, code[1]==='B'],
    ['重心', AX.w.left, AX.w.right, code[2]==='L'],
  ].map(function(r){
    const on=r[3]?r[1]:r[2], off=r[3]?r[2]:r[1];
    return '<div class="pole-row"><span class="pole-name">'+r[0]+'</span>'+
      '<span class="pole-pick">'+on+'</span><span class="pole-alt">'+off+'</span></div>';
  }).join('');
  const picked=[code[0]==='O'?AX.h.left:AX.h.right, code[1]==='B'?AX.c.left:AX.c.right, code[2]==='L'?AX.w.left:AX.w.right];
  const aru=t.aru.map(function(a){ return '<li>'+a+'</li>'; }).join('');
  // トリセツ（このタイプとの付き合い方）
  const tsItems=(TORISET[code]||[]).map(function(it,i){
    return '<div class="ts-card"><span class="ts-l"><span class="num">'+NUMS[i]+'</span>'+it.l+'</span>'
         + '<span class="ts-t">'+it.t+'</span></div>'; }).join('');
  const toriset='<div class="toriset-band"><div class="ts-label">TORISETSU</div>'+
    '<p class="ts-title">このタイプのトリセツ</p>'+
    '<p class="ts-lead">「この人はこういう人」<br>関わり方のコツ</p>'+tsItems+'</div>';
  // 深層（なぜそう振る舞うのか）
  const hs=HONSHITSU[code];
  const honshitsu=hs?('<p class="sectlabel">深層</p><div class="honshitsu">'+
    '<p class="hs-sub">このタイプの振る舞いを決める「ほんとうの理由」</p>'+
    '<p class="hs-core">'+hs.core+'</p><p class="hs-cost">'+hs.cost+'</p></div>'):'';
  const el=document.createElement('section');
  el.className='card '+pole; el.id=code;
  el.innerHTML=
    '<div class="card-head">'+
      '<div class="emblem-wrap">'+
        '<div class="emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(TYPE_ICON[code]||'')+'</svg></div>'+
        '<div class="rays" aria-hidden="true">'+raysHTML(code)+'</div>'+
      '</div>'+
      '<p class="tcatch">'+t.catch+'</p><h2 class="tname">'+t.name+'</h2><span class="chip">'+code+'</span>'+
    '</div>'+
    '<div class="card-body">'+
      '<p class="sectlabel">このタイプの関係性</p><div class="poles">'+ax3+'</div>'+
      '<div class="formula">'+
        '<div class="f-row">'+picked.map(function(p){return '<span class="f-chip">'+p+'</span>';}).join('<span class="f-op">+</span>')+'</div>'+
        '<div class="f-arrow">↓</div>'+
        '<div class="f-type">'+t.name+'<small>'+code+'</small></div>'+
      '</div>'+
      '<p class="sectlabel">あるある</p><ul class="aru">'+aru+'</ul>'+
      '<div class="row-block"><p class="sectlabel">強み</p><p>'+t.tsuyomi+'</p></div>'+
      toriset+
      honshitsu+
    '</div>';
  return el;
}

Object.keys(TYPES).forEach(function(code){ gallery.appendChild(buildCard(code)); });
