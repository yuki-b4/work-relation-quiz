<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナチュール診断</title>
<!--
  旧サイト（GitHub Pages）から新ドメインへの引き継ぎ（アプリ化要件定義.md 7.2）。

  ここが GitHub Pages の公開元。中身はリダイレクトだけ。
  このファイルは、紹介リンクとして配布済みの .../prototype.html?ref=… の受け口。
  リポジトリ直下の prototype.html と all-types.html はアプリの文面の正なので触らず、
  公開元をこの docs/ に移すことで旧URLだけを差し替えている。
  ?ref= などのクエリとハッシュは引き継ぐ（紹介元の計測が切れないように）。
-->
<link rel="canonical" href="https://natur-indicator.com/">
<meta name="robots" content="noindex">
<script>
  location.replace('https://natur-indicator.com/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://natur-indicator.com/">
</head>
<body>
<noscript>
  <p>ナチュール診断は <a href="https://natur-indicator.com/">natur-indicator.com</a> へ移転しました。</p>
</noscript>
</body>
</html>
